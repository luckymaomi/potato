app:
  name: potato API
  version: 0.0.1
  debug: true
  language: zh

server:
  port: 5679
  host: 0.0.0.0
  cors_origins:
    - http://localhost:3012
  insecure_tls: false

database:
  type: sqlite
  path: ./backend/data/tomato_ai_drama.db

storage:
  type: local
  local_path: ./backend/data/storage
  base_url: http://localhost:5679/static

ai:
  providers:
    agnes:
      enabled: true
      base_url: https://apihub.agnes-ai.com/v1
      api_key: ""
    pearapi:
      enabled: true
      base_url: https://api.pearapi.ai
      # `/v1/models` 与 `/v1/chat/completions` 使用默认渠道的 `sk-` 令牌，请求时放在 Authorization 头。
      api_key: ""
